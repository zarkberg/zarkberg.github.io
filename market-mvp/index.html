<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>农产品商情匹配 MVP</title>
  <style>
    body{margin:0;background:#f3f6fb;color:#172033;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    main{max-width:760px;margin:0 auto;padding:28px 20px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:18px;padding:26px;box-shadow:0 8px 24px #17203312}h1{margin:0 0 8px;color:#166534}h2{margin-top:26px;font-size:20px}.muted{color:#64748b}.flow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.step{padding:12px;background:#f0fdf4;border-radius:10px}.step b{display:block;color:#166534}.btn{display:inline-block;margin:16px 8px 0 0;padding:10px 15px;border-radius:10px;background:#16a34a;color:#fff;text-decoration:none;font-weight:700}.btn.secondary{background:#eef4ff;color:#2563eb}@media(max-width:520px){.flow{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>农产品商情匹配 MVP</h1>
      <p class="muted">独立于专利雷达的另一个产品实验：把用户主动带入的社群商情转成可确认、可追溯的供需线索。</p>
      <h2>体验流程</h2>
      <div class="flow">
        <div class="step"><b>1. 主动导入</b>粘贴、转发或截图识别</div>
        <div class="step"><b>2. 用户确认</b>确认字段和授权来源</div>
        <div class="step"><b>3. 群主协作</b>生成群主/组织入口</div>
        <div class="step"><b>4. 双方联系</b>对方确认后再交换联系方式</div>
      </div>
      <h2>边界说明</h2>
      <p class="muted">不读取朋友圈、不监听微信群、不抓取联系人关系；不经手货款、不承诺成交。正式收费应明示为信息服务费。</p>
      <a class="btn" href="https://github.com/zarkberg/zarkberg.github.io/tree/main/market-mvp/eldercare-miniprogram">下载小程序 MVP</a>
      <a class="btn secondary" href="https://github.com/zarkberg/zarkberg.github.io/discussions">提交反馈</a>
    </div>
  </main>
</body>
</html>
